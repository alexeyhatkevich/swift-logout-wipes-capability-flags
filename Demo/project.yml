name: Demo
options:
  bundleIdPrefix: com.alexeyhatkevich
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LogoutWipe:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Demo:
    type: application
    platform: iOS
    sources:
      - path: Demo
    dependencies:
      - package: LogoutWipe
        product: LogoutWipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexeyhatkevich.swift-logout-wipes-capability-flags.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: LogoutWipe Demo
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
        Release:
          "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
schemes:
  Demo:
    build:
      targets:
        Demo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LogoutWipe/LogoutWipeTests
